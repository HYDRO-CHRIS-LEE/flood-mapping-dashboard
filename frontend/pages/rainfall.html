<!-- Rainfall Analysis page fragment -->
<section class="mb-8">
  <p class="text-secondary font-semibold text-sm tracking-widest uppercase mb-1">Intelligence Suite</p>

  <p class="mt-2 text-base text-on-surface-variant">Real-time precipitation monitoring and hydrologic forecasting.</p>
</section>

</div>

<!-- Content area -->
<div id="rainfall-content">
  <div class="flex items-center justify-center py-20">
    <div class="text-center">
      <span class="material-symbols-outlined mb-3 text-5xl text-outline animate-pulse">hourglass_top</span>

    </div>
  </div>
</div>
